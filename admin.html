<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urban Hide — Admin Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">

  <div class="admin-shell">
    <!-- SIDEBAR -->
    <aside class="admin-sidebar">
      <div class="admin-logo">
        <i class="fa-solid fa-shirt"></i>
        <div>
          <span>Urban Hide</span>
          <small>Admin Portal</small>
        </div>
      </div>

      <nav class="admin-nav">
        <button class="admin-nav-btn active" data-tab="products">
          <i class="fas fa-box-open"></i> Inventory
        </button>
        <button class="admin-nav-btn" data-tab="settings">
          <i class="fas fa-sliders-h"></i> Store Settings
        </button>
      </nav>

      <div class="admin-sidebar-footer">
        <a href="index.html" target="_blank" rel="noopener">
          <i class="fas fa-external-link-alt"></i> View Storefront
        </a>
        <div class="db-status">
          <span class="dot"></span> Live Database Connected
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1 id="adminTitle">Inventory</h1>
          <p id="adminSubtitle">Manage your products, pricing, and stock in real-time.</p>
        </div>
        <div class="admin-top-actions">
          <button class="btn-admin btn-admin-primary" id="addProductBtn">
            <i class="fas fa-plus"></i> Add New Jacket
          </button>
        </div>
      </div>

      <!-- INVENTORY TAB -->
      <section class="admin-tab active" id="tab-products">
        <div class="stats-grid" id="statsGrid"></div>

        <div class="admin-card">
          <div class="admin-card-head">
            <h2>All Products</h2>
            <div class="admin-search">
              <i class="fas fa-search"></i>
              <input id="productSearch" type="search" placeholder="Search products..." />
            </div>
          </div>

          <div class="table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Product Details</th>
                  <th>Category</th>
                  <th>Price</th>
                  <th>Featured</th>
                  <th>Stock Status</th>
                  <th class="text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="productTableBody">
                <!-- Loaded via JS -->
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- SETTINGS TAB -->
      <section class="admin-tab" id="tab-settings">
        <div class="admin-card">
          <div class="admin-card-head">
            <h2>Store Configuration</h2>
            <p class="admin-muted">Update your contact details and currency display.</p>
          </div>

          <form id="settingsForm" class="settings-form">
            <div class="form-grid">
              <div class="form-row">
                <label for="settingsWhatsapp">WhatsApp Number (digits only)</label>
                <input id="settingsWhatsapp" name="whatsappNumber" type="text" placeholder="923365447075" required />
              </div>

              <div class="form-row">
                <label for="settingsPhone">Phone Display</label>
                <input id="settingsPhone" name="phoneDisplay" type="text" placeholder="+92 336 5447075" required />
              </div>

              <div class="form-row">
                <label for="settingsCurrency">Currency Code</label>
                <input id="settingsCurrency" name="currency" type="text" placeholder="PKR" required />
              </div>

              <div class="form-row">
                <label for="settingsCurrencySymbol">Currency Symbol</label>
                <input id="settingsCurrencySymbol" name="currencySymbol" type="text" placeholder="Rs " required />
              </div>

              <div class="form-row form-row-full">
                <label for="settingsAddress">Store Address</label>
                <textarea id="settingsAddress" name="address" rows="3" required></textarea>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn-admin btn-admin-primary">
                <i class="fas fa-save"></i> Save Settings
              </button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>

  <!-- PRODUCT FORM MODAL -->
  <div class="admin-modal-overlay" id="adminModalOverlay">
    <div class="admin-modal">
      <button class="admin-modal-close" id="adminModalClose" aria-label="Close">
        <i class="fas fa-times"></i>
      </button>

      <h2 id="adminModalTitle">Add Product</h2>

      <form id="productForm">
        <div class="form-grid">
          <div class="form-row form-row-full">
            <label for="productName">Product Name</label>
            <input id="productName" name="name" type="text" required />
          </div>

          <div class="form-row">
            <label for="productCategory">Category</label>
            <input id="productCategory" name="category" type="text" list="categoryList" required />
            <datalist id="categoryList">
              <option value="leather"></option>
              <option value="bomber"></option>
              <option value="denim"></option>
              <option value="puffer"></option>
              <option value="varsity"></option>
            </datalist>
          </div>

          <div class="form-row">
            <label for="productPrice">Price</label>
            <input id="productPrice" name="price" type="number" min="0" step="1" required />
          </div>

          <div class="form-row">
            <label for="productOldPrice">Old Price (optional)</label>
            <input id="productOldPrice" name="oldPrice" type="number" min="0" step="1" />
          </div>

          <div class="form-row">
            <label for="productBadge">Badge (optional)</label>
            <input id="productBadge" name="badge" type="text" placeholder="Best Seller" />
          </div>

          <div class="form-row form-row-full">
            <label for="productImage">Image URL</label>
            <input id="productImage" name="image" type="url" placeholder="https://..." />
          </div>

          <div class="form-row form-row-full">
            <label for="productDescription">Description</label>
            <textarea id="productDescription" name="description" rows="3"></textarea>
          </div>

          <div class="form-row form-row-full">
            <label for="productSizes">Sizes (comma separated)</label>
            <input id="productSizes" name="sizes" type="text" placeholder="S, M, L, XL" />
          </div>

          <div class="form-row form-row-full check-row">
            <label>
              <input id="productFeatured" name="featured" type="checkbox" />
              <span>Featured on homepage</span>
            </label>
            <label>
              <input id="productInStock" name="inStock" type="checkbox" checked />
              <span>In stock</span>
            </label>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-admin btn-admin-secondary" id="cancelProductBtn">Cancel</button>
          <button type="submit" class="btn-admin btn-admin-primary">
            <i class="fas fa-save"></i> Save Product
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="admin-toast" id="adminToast"></div>

  <script src="admin.js"></script>
</body>
</html>
